name: Update SOP docs

# Weekly drift check: asks Claude Code to audit SOP.md / BUSINESS_OPS_SOP.md
# against the actual state of the codebase, and open a PR if they've drifted.
# Never commits to main directly — always via a PR for human review.
#
# ── Required setup (done manually in GitHub's UI, not by this workflow) ──
#   1. Repo secret: ANTHROPIC_API_KEY
#      Settings → Secrets and variables → Actions → New repository secret.
#   2. Actions permissions for GITHUB_TOKEN must allow at least:
#        contents: write        (create branch + commit)
#        pull-requests: write   (open the PR)
#      Settings → Actions → General → Workflow permissions, OR rely on the
#      `permissions:` block below if your org allows workflows to set their
#      own (some orgs enforce a repo-wide read-only default that overrides it).
#
# This job is intentionally read-only against everything except SOP.md and
# BUSINESS_OPS_SOP.md: no Airtable, no SendGrid, no Stripe, no Railway, no
# pipeline code edits. It only has credentials for the Anthropic API and the
# GitHub token GitHub itself injects for this run.

on:
  schedule:
    # Monday night US Eastern. GitHub Actions cron is UTC-only, so this is
    # expressed as Tuesday 02:00 UTC, which lands ~9-10pm ET Monday depending
    # on DST. Adjust if you want a different local time.
    - cron: '0 2 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sops
  cancel-in-progress: false

jobs:
  update-sops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Build prompt
        id: build_prompt
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          cat > /tmp/sop-update-prompt.txt <<'PROMPT_EOF'
          You are running as an unattended, scheduled GitHub Actions job for
          Carolina Compliance Solutions. Nobody is present to answer questions
          mid-run, so make reasonable, clearly-flagged assumptions instead of
          stopping to ask.

          Below is the full, verbatim content of this repo's
          `.claude/commands/update-sops.md` process. It is inlined here
          because slash commands do not resolve when Claude Code runs
          headlessly (`claude -p`), only in interactive sessions.

          ---- BEGIN .claude/commands/update-sops.md ----
          Refresh SOP.md and BUSINESS_OPS_SOP.md against the current state of the codebase. Do not trust what either document currently says — read the actual code fresh, as if auditing it for the first time, then reconcile against what's written.

          Process:
          1. Read both existing SOP documents in full.
          2. Re-read the actual pipeline code, cron/service configs, Airtable schema (pulled live), and email templates — the same categories of source material used to build them originally.
          3. For each section in each document, compare what's written against what the code actually does right now. Note every discrepancy you find, however small.
          4. Update only the sections that have drifted. Do not rewrite sections that are still accurate just to change phrasing.
          5. At the top of each document, maintain a "Last verified" changelog: today's date (ask me what to write if you don't have it), followed by a short bullet list of what changed since the last verification and why (e.g. "module_10 now also handles Deficiency Request routing — updated §2 and BUSINESS_OPS_SOP §2 accordingly"). Keep old changelog entries below, don't delete history.
          6. If you find genuinely new behavior that doesn't fit any existing section (a new module, a new email type, a new table), add a new section rather than cramming it into an existing one, and flag it clearly as newly discovered.
          7. If something in either document can no longer be verified from the code (e.g. a module was removed), don't just delete it silently — move it to a "Deprecated / No Longer Applicable" section at the bottom with a one-line note on when it stopped applying, so there's a record of what used to be true.
          8. End your response with a plain-language summary of what changed, ordered by how much it matters to how the business actually runs day to day — not alphabetically or by file order.

          Do not soften findings to make the system look more maintained than it is. Drift is expected and fine to report plainly.
          ---- END .claude/commands/update-sops.md ----

          The following adjustments apply to THIS automated, unattended run
          and override the process above wherever they conflict:

          - Today's date is {{TODAY}}. Wherever step 5 says "today's date",
            use that literally. Step 5's "ask me what to write if you don't
            have it" doesn't apply — there is no one to ask in this run.
          - Step 2's "Airtable schema (pulled live)" doesn't apply. This job
            has no Airtable, SendGrid, Stripe, or Railway credentials and must
            not attempt to reach any of them. Base your review only on this
            repository's code, config files, and git history. If a claim in
            either document can only be verified against live Airtable schema
            you can't see, don't guess at it and don't flag it as a
            discrepancy — note it as out of scope for this automated pass.
          - If BUSINESS_OPS_SOP.md does not exist in this repository, do not
            create it from scratch. Leave it untouched and say so plainly in
            your summary so a human can decide whether to write one. Only
            edit it if it already exists.
          - You may only read files and run read-only inspection commands
            (git log/diff/show/status/blame, grep, find, ls, cat, head,
            tail, wc). You may only write to SOP.md and BUSINESS_OPS_SOP.md.
            Do not modify any other file, and do not attempt to run, import,
            or execute any pipeline module.
          - Compare against git history since the "Last verified" date already
            recorded at the top of each document (not just the current
            working tree), so you catch drift even if this job hasn't run
            or hasn't found anything in a while.
          - If, after doing the review, you conclude nothing meaningful has
            changed since the last verification — no discrepancies worth
            recording, nothing new, nothing deprecated — make NO edits to
            either file. Do not touch the changelog, do not add a
            "verified, no changes" entry, do not bump the date just because
            this job ran. A no-op run is a valid and expected outcome; don't
            force a changelog entry to justify the run having happened.

          When you are completely done, print exactly one block in this exact
          format as the very last thing in your response, with nothing after
          it:

          ===SOP_UPDATE_RESULT===
          CHANGES_MADE: yes
          (or)
          CHANGES_MADE: no
          SUMMARY:
          <if CHANGES_MADE is yes: the plain-language summary from step 8
          above, in markdown, ordered by real-world business impact. If
          CHANGES_MADE is no: one or two sentences on what you checked and
          why nothing warranted an update.>
          ===END_SOP_UPDATE_RESULT===
          PROMPT_EOF

          sed -i "s/{{TODAY}}/$TODAY/" /tmp/sop-update-prompt.txt

      - name: Run Claude Code
        id: run_claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat /tmp/sop-update-prompt.txt)" \
            --allowedTools "Read,Glob,Grep,Edit(./SOP.md),Edit(./BUSINESS_OPS_SOP.md),Write(./SOP.md),Write(./BUSINESS_OPS_SOP.md),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status:*),Bash(git blame:*),Bash(grep:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*)" \
            --max-turns 60 \
            | tee /tmp/sop-update-output.log

      - name: Parse result
        id: parse
        run: |
          awk '/===SOP_UPDATE_RESULT===/{flag=1; next} /===END_SOP_UPDATE_RESULT===/{flag=0} flag' \
            /tmp/sop-update-output.log > /tmp/sop-update-result.txt

          if [ ! -s /tmp/sop-update-result.txt ]; then
            echo "::error::Claude did not print the expected SOP_UPDATE_RESULT block. Failing so this is visible instead of silently no-opping."
            exit 1
          fi

          CHANGES_MADE=$(grep -m1 '^CHANGES_MADE:' /tmp/sop-update-result.txt | sed 's/^CHANGES_MADE:[[:space:]]*//' | tr -d '[:space:]')
          if [ "$CHANGES_MADE" != "yes" ] && [ "$CHANGES_MADE" != "no" ]; then
            echo "::error::Could not parse CHANGES_MADE (got: '$CHANGES_MADE')."
            exit 1
          fi

          sed -n '/^SUMMARY:/,$p' /tmp/sop-update-result.txt | tail -n +2 > /tmp/pr-body.md

          echo "changes_made=$CHANGES_MADE" >> "$GITHUB_OUTPUT"

      - name: Verify only SOP files were touched
        id: verify
        run: |
          CHANGED=$(git status --porcelain | awk '{print $2}')
          UNEXPECTED=$(echo "$CHANGED" | grep -vE '^(SOP\.md|BUSINESS_OPS_SOP\.md)$' || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Claude touched files outside SOP.md/BUSINESS_OPS_SOP.md: $UNEXPECTED"
            exit 1
          fi

          if [ "${{ steps.parse.outputs.changes_made }}" = "yes" ] && [ -z "$CHANGED" ]; then
            echo "::error::Claude reported CHANGES_MADE: yes but no files actually changed."
            exit 1
          fi

          if [ "${{ steps.parse.outputs.changes_made }}" = "no" ] && [ -n "$CHANGED" ]; then
            echo "::error::Claude reported CHANGES_MADE: no but files were modified on disk: $CHANGED"
            exit 1
          fi

      - name: Open PR
        if: steps.parse.outputs.changes_made == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="automated/sop-update-${TODAY}-${{ github.run_number }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          for f in SOP.md BUSINESS_OPS_SOP.md; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "docs: automated SOP update - ${TODAY}"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: automated SOP update - ${TODAY}" \
            --body-file /tmp/pr-body.md
