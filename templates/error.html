<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} — CCS Review</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='ccs_icon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
</head>
<body>

<nav class="topnav">
  <a href="/queue" class="topnav-logo" aria-label="Carolina Compliance Solutions">
    <img src="{{ url_for('static', filename='ccs_logo_dark.svg') }}" alt="CCS">
  </a>
  <div class="topnav-links">
    <a href="/queue" class="nav-link">Queue</a>
    <a href="/logout" class="btn btn-gold btn-sm">Sign out</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="error-page">
    <div class="error-code">{{ code }}</div>
    <p class="headline-sm mb-16">{{ title }}</p>
    <p class="error-msg">{{ message }}</p>
    <a href="/queue" class="btn btn-primary">Back to the queue</a>
  </div>
</div>

</body>
</html>
