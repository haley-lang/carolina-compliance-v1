# Railway service configuration — Carolina Compliance Solutions
#
# This file configures the web service only.
# Cron jobs (daily pipeline, weekly backup, follow-up ladder) are configured
# as separate Railway Cron services in the Railway UI, not in this file.

[deploy]
startCommand = "gunicorn module_16_inbound_webhook:app --bind 0.0.0.0:$PORT --workers 2"
healthcheckPath = "/health"
